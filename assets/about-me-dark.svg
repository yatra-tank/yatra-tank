<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">A little about me</title>
  <desc id="desc">Hey, I'm Yatra. A computer science student who enjoys coding, designing and figuring out how things work.</desc>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="#2C382D" stroke="#435542" stroke-width="2"/>
  <rect x="42" y="42" width="5" height="216" rx="2.5" fill="#82977A"/>
  <text x="76" y="78" fill="#B1C49F" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2.5">01 / A LITTLE ABOUT ME</text>
  <text x="76" y="139" fill="#E7EDE2" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Hey, I'm Yatra!</text>
  <text x="76" y="190" fill="#D0DCCB" font-family="Arial, Helvetica, sans-serif" font-size="22">I'm a computer science student who enjoys coding, designing</text>
  <text x="76" y="224" fill="#D0DCCB" font-family="Arial, Helvetica, sans-serif" font-size="22">and figuring out how things work. Usually learning something,</text>
  <text x="76" y="258" fill="#D0DCCB" font-family="Arial, Helvetica, sans-serif" font-size="22">building something, or wondering why something isn't working.</text>
